name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Package extension
        run: |
          mkdir -p dist/NovaTab
          cp -r extension/* dist/NovaTab/
          cd dist
          zip -r "NovaTab-${GITHUB_REF_NAME}.zip" NovaTab

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/NovaTab-${{ github.ref_name }}.zip
          generate_release_notes: true
          body: |
            ## 安装方法

            1. 下载下方的 `NovaTab-${{ github.ref_name }}.zip` 并解压
            2. 打开 Chrome，访问 `chrome://extensions/`
            3. 开启右上角「开发者模式」
            4. 点击「加载已解压的扩展程序」，选择解压后的 `NovaTab` 文件夹
            5. 打开新标签页即可使用

            ---
